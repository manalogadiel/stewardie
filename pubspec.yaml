name: stewardie
description: A local demo of shared responsibilities and check-ins.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  go_router: ^18.0.1
  image: ^4.10.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/nunito-sans.ttf
