name: stewardie
description: A shared-life app for everyday plans, responsibilities, and moments.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.1
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  go_router: ^18.0.1
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  timezone: ^0.10.1
  web: ^1.1.1
  purchases_flutter: ^10.13.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geolocator_android: ^4.6.2
  geolocator_apple: ^2.3.14
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/nunito-sans.ttf
