project_id = "stewardie"
[functions.media]
# Firebase ID tokens are verified inside the gateway before every operation.
verify_jwt = false

[functions.reconcile-subscription]
# Firebase ID tokens and RevenueCat webhooks are verified inside the edge function.
verify_jwt = false

[functions.scheduled-work]
# Supabase Cron sends STEW_WORKER_SECRET; no public/mobile caller is allowed.
verify_jwt = false

[functions.mood]
# The function validates Firebase ID tokens and membership itself.
verify_jwt = false

[functions.space-actions]
# Firebase ID tokens are verified in the function before privileged changes.
verify_jwt = false

[functions.task-access]
# Firebase identity, current membership, and exact history limits are checked inside.
verify_jwt = false

[functions.core-data]
# Firebase JWT verification is mandatory inside the gated migration endpoint.
verify_jwt = false
