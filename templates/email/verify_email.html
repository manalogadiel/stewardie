  <title>Verify your email</title>
  <style>
    body {
      margin: 0;
      padding: 48px 16px;
      background-color: #FAF9F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1E2430;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid #ECECF0;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
    }

      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto 18px;
      object-fit: contain;
    }

      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      color: #1E2430;
      letter-spacing: -0.2px;
    }
    p {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.5;
      color: #6B7280;
    }
    .btn {
      display: inline-block;
      background-color: #244BFF;
      color: #FFFFFF !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 12px;
    }
    .footer {
      max-width: 400px;
      margin: 20px auto 0;
      text-align: center;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
