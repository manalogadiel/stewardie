<!DOCTYPE html>

        .celebrate-image {

          filter: drop-shadow(0 24px 40px rgba(32, 38, 51, 0.16));

        }
        .outro-title {
          font-size: 74px;
          font-weight: 900;
          color: #111827;
          line-height: 1.1;
          letter-spacing: -0.035em;
          margin-bottom: 16px;
        }
        .brand-gradient {
          background: linear-gradient(135deg, #1a3cd4 0%, #4338ca 50%, #7c3aed 100%);

          font-size: 26px;
          font-weight: 800;
          box-shadow: 0 16px 40px rgba(26, 60, 212, 0.35);

          letter-spacing: -0.01em;

      <div id="root" data-composition-id="scene7" data-width="1920" data-height="1080">

            <div class="platform-badge"><span>⚡</span> Instant QR Space Setup</div>

        <script>
          const tl = gsap.timeline({ paused: true });
          window.__timelines["scene7"] = tl;

          tl.fromTo("#c7-mascot", { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "back.out(1.8)" }, 0.2);
          tl.fromTo("#c7-title", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.6);
          tl.fromTo("#c7-tagline", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.0);
          tl.fromTo("#c7-cta", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(2)" }, 1.4);
          tl.fromTo("#c7-badges", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.8);

          // Joyful mascot bounce
          tl.to("#c7-mascot", { y: -16, duration: 0.8, repeat: 15, yoyo: true, ease: "sine.inOut" }, 1.6);

          tl.seek(0);
