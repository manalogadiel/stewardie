          font-weight: 800;

          filter: drop-shadow(0 20px 40px rgba(32, 38, 51, 0.15));

        .mood-bubble {

      <div id="root" data-composition-id="scene5" data-width="1920" data-height="1080">
        <div class="stage-container">

            <div class="phone-mockup">
              <div class="phone-notch"></div>

              <img src="assets/screencasts/screen_space.png" alt="Moods & Space Screen" class="phone-screen" id="el-screen" />

              <div class="mood-bubble" id="el-mood-bubble">

              <span>Daily Emotional Pulse</span>

            <div class="feature-badge" id="el-badge2">
              <div class="badge-icon">🌱</div>
              <span>Gentle Household Empathy</span>

      <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene5"] = tl;

      // Frame entrance (0s - 1.5s)
      tl.from("#el-phone", {
        scale: 0.9,
        y: 50,
        opacity: 0,
        duration: 1.2,
        ease: "power3.out"
      }, 0);

      tl.from("#el-tag, #el-title, #el-body", {
        x: -40,
        opacity: 0,
        stagger: 0.15,
        duration: 1.0,
        ease: "power2.out"
      }, 0.3);

      tl.from("#el-badge1, #el-badge2", {
        x: 40,
        opacity: 0,
        stagger: 0.2,
        duration: 1.0,
        ease: "power2.out"
      }, 0.5);

      tl.from("#el-mascot", {
        scale: 0.6,
        rotation: -10,
        opacity: 0,
        duration: 1.2,
        ease: "elastic.out(1, 0.6)"
      }, 0.8);

      // Mood selection trigger (1.5s - 2.8s)
      tl.fromTo("#el-mood-bubble", {
        xPercent: -50,
        yPercent: -50,
        scale: 0
      }, {
        scale: 1,
        duration: 0.5,
        ease: "back.out(2)"
      }, 1.5);

      tl.to("#el-mascot", {
        y: -18,
        duration: 0.4,
        yoyo: true,
        repeat: 2,
        ease: "power1.inOut"
      }, 2.1);

      // Hold and fade out (14.8s - 16s)
      tl.to("#root", {
        opacity: 0,
        duration: 1.2,
        ease: "power2.in"
      }, 14.8);

      tl.seek(0);
    </script>
