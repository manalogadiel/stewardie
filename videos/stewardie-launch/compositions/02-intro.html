<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: Meet Stewardie</title>
  </head>
  <body>
    <template id="hyperframes-root">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          user-select: none;
        }

        body {
          margin: 0;
          background: transparent;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          overflow: hidden;
        }

        #root {
          width: 1920px;
          height: 1080px;
          position: relative;
          overflow: hidden;
          background: #faf8f5;
        }

        /* Ambient Lighting Mesh Backdrop */
        .ambient-mesh {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 80% 20%, rgba(219, 234, 254, 0.6) 0%, transparent 45%),
            radial-gradient(circle at 15% 80%, rgba(254, 240, 138, 0.45) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(254, 243, 199, 0.35) 0%, transparent 60%);
          z-index: 1;
        }

        .intro-container {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 140px;
          box-sizing: border-box;
          z-index: 2;
        }

        /* Left Side Typography & Branding */
        .intro-left {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          max-width: 820px;
          z-index: 5;
        }
        .brand-badge {
          display: flex;
          align-items: center;
          gap: 12px;
          background: #ffffff;
          border: 1.5px solid #dbeafe;
          border-radius: 9999px;
          padding: 8px 20px;
          margin-bottom: 24px;
          box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
        }
        .brand-badge img {
          width: 26px;
          height: 26px;
          border-radius: 50%;
        }
        .brand-badge span {
          font-size: 15px;
          font-weight: 800;
          color: #1e40af;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        .brand-title {
          font-size: 84px;
          font-weight: 900;
          color: #111827;
          line-height: 1.05;
          letter-spacing: -0.045em;
          margin-bottom: 20px;
        }
        .highlight-gradient {
          background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 50%, #7c3aed 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .brand-tagline {
          font-size: 30px;
          font-weight: 700;
          color: #1f2937;
          line-height: 1.3;
          margin-bottom: 18px;
          letter-spacing: -0.02em;
        }
        .brand-desc {
          font-size: 21px;
          font-weight: 500;
          color: #4b5563;
          line-height: 1.55;
          max-width: 720px;
          margin-bottom: 30px;
        }
        /* Floating Feature Pills */
        .feature-pills {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
        }
        .feature-pill {
          background: #ffffff;
          border: 1.5px solid #e5e7eb;
          padding: 10px 20px;
          border-radius: 9999px;
          font-size: 16px;
          font-weight: 700;
          color: #1f2937;
          display: flex;
          align-items: center;
          gap: 8px;
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
        }

        /* Right Side Hero Stage with Authentic App Phone & Mascot */
        .intro-right {
          position: relative;
          width: 680px;
          height: 740px;
          display: flex;
          align-items: center;
          justify-content: center;
          perspective: 1200px;
        }
        .intro-hero-stage {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          transform: rotateY(-8deg) rotateX(2deg);
        }
        .intro-phone {
          width: 300px;
          height: 630px;
          background: #ffffff;
          border-radius: 44px;
          border: 8px solid #1f2937;
          box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05);
          overflow: hidden;
          position: relative;
        }
        .intro-screen-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        .mascot-image {
          position: absolute;
          bottom: -20px;
          right: -60px;
          width: 340px;
          height: auto;
          filter: drop-shadow(0 20px 30px rgba(30, 41, 59, 0.2));
          z-index: 10;
        }
        .sparkle-badge {
          position: absolute;
          top: -16px;
          left: -20px;
          background: #fef08a;
          border: 2px solid #fde047;
          border-radius: 9999px;
          padding: 10px 22px;
          font-size: 16px;
          font-weight: 900;
          color: #854d0e;
          box-shadow: 0 10px 20px rgba(250, 204, 21, 0.35);
          z-index: 12;
        }
      </style>

      <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080">
        <div class="ambient-mesh"></div>

        <div class="intro-container">
          <!-- Left Content -->
          <div class="intro-left">
            <div class="brand-badge" id="c2-badge">
              <img src="assets/branding/stewardie-icon.png" alt="Stewardie Icon">
              <span>Meet Stewardie</span>
            </div>

            <h1 class="brand-title" id="c2-title">
              Life together, <br><span class="highlight-gradient">in harmony.</span>
            </h1>

            <p class="brand-tagline" id="c2-tagline">
              Your people. Your plans. Your little moments.
            </p>

            <p class="brand-desc" id="c2-desc">
              The warm, tactile shared-life companion designed for families, housemates, and close crews to coordinate effortlessly without nagging.
            </p>

            <div class="feature-pills" id="c2-pills">
              <div class="feature-pill"><span>⚡</span> Zero Nagging Chore Flow</div>
              <div class="feature-pill"><span>📸</span> Private Moments in Clay TV</div>
              <div class="feature-pill"><span>🗺️</span> 15m Private Location Windows</div>
            </div>
          </div>

          <!-- Right Hero Stage with Authentic Phone & Clay Trio -->
          <div class="intro-right">
            <div class="intro-hero-stage" id="c2-card">
              <!-- Authentic Phone Mockup showing Today screen -->
              <div class="intro-phone">
                <img src="assets/screens/today-intro.png" alt="Stewardie App Screen" class="intro-screen-img" />
              </div>

              <!-- Floating Mascot Badge -->
              <div class="sparkle-badge" id="c2-sparkle" data-layout-allow-overlap>✨ Soft Pop Magic</div>

              <!-- Mascot in front of phone -->
              <img id="c2-mascot" class="mascot-image" src="assets/illustrations/greeting.png" alt="Stewardie Mascots" data-layout-allow-overlap />
            </div>
          </div>
        </div>

        <script>
          const tl = gsap.timeline({ paused: true });
          window.__timelines["scene2"] = tl;

          // Sequential entrance
          tl.fromTo("#c2-badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
          tl.fromTo("#c2-title", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.4);
          tl.fromTo("#c2-tagline", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.9);
          tl.fromTo("#c2-desc", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.3);
          tl.fromTo("#c2-pills", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.7);

          // Card entrance with elastic 3D depth
          tl.fromTo("#c2-card", { opacity: 0, scale: 0.85, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "back.out(1.5)" }, 0.6);
          tl.fromTo("#c2-sparkle", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, 1.4);

          // Breathing float motion on mascot
          tl.to("#c2-mascot", { y: -14, duration: 2.2, repeat: 3, yoyo: true, ease: "sine.inOut" }, 1.8);

          // Fade out transition
          tl.to("#root", { opacity: 0, duration: 1.0, ease: "power2.in" }, 11.0);

          tl.seek(0);
        </script>
      </div>
    </template>
  </body>
</html>
