<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene 6: Shared Plans & Moods</title>
  </head>
  <body>
    <template id="hyperframes-root">
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap");

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          user-select: none;
        }
        body {
          margin: 0;
          background: transparent;
          font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          overflow: hidden;
        }

        #root {
          width: 1920px;
          height: 1080px;
          position: relative;
          overflow: hidden;
          background: #faf8f5;
        }

        /* Ambient Mesh Backdrop */
        .ambient-mesh {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 75% 25%, rgba(254, 240, 138, 0.5) 0%, transparent 45%),
            radial-gradient(circle at 20% 75%, rgba(254, 215, 170, 0.45) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(254, 243, 199, 0.35) 0%, transparent 60%);
          z-index: 1;
        }

        .stage-container {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2;
        }

        /* Centered Phone Shell */
        .phone-wrapper {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          perspective: 1200px;
          z-index: 10;
        }

        .phone-mockup {
          width: 320px;
          height: 670px;
          background: #ffffff;
          border-radius: 46px;
          border: 9px solid #1f2937;
          box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05);
          position: relative;
          overflow: hidden;
          transform: rotateY(0deg) rotateX(1deg);
        }

        /* Screen Interior */
        .screen-inner {
          width: 100%;
          height: 100%;
          position: relative;
          overflow: hidden;
          background: #faf8f5;
        }
        .screen-bg {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        /* Shared Plan Card Overlay on Calendar */
        .plan-card-overlay {
          position: absolute;
          bottom: 24px;
          left: 14px;
          right: 14px;
          background: #fdfbf7;
          border: 2px solid #2563eb;
          border-radius: 24px;
          padding: 14px 16px;
          box-shadow: 0 8px 24px rgba(37, 99, 235, 0.16);
          display: flex;
          flex-direction: column;
          gap: 6px;
          z-index: 15;
        }
        .plan-top {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .plan-tag {
          font-size: 11px;
          font-weight: 800;
          color: #1e40af;
          background: #dbeafe;
          padding: 3px 8px;
          border-radius: 8px;
          text-transform: uppercase;
        }
        .plan-name {
          font-size: 15px;
          font-weight: 800;
          color: #111827;
        }
        .plan-meta {
          font-size: 11px;
          font-weight: 600;
          color: #4b5563;
        }
        .plan-crew {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 2px;
        }
        .crew-avatar {
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: #2563eb;
          color: #ffffff;
          font-size: 10px;
          font-weight: 800;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .crew-avatar.alex { background: #16a34a; }
        .crew-avatar.sam { background: #9333ea; }

        /* Authentic MoodSheet Component */
        .mood-sheet {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: #ffffff;
          border-radius: 36px 36px 0 0;
          box-shadow: 0 -16px 50px rgba(32, 38, 51, 0.22);
          padding: 14px 18px 22px 18px;
          z-index: 30;
          transform: translateY(100%);
        }
        .sheet-drag {
          width: 44px;
          height: 5px;
          background: #d4dae5;
          border-radius: 3px;
          margin: 0 auto 12px auto;
        }
        .sheet-caption {
          font-size: 12px;
          font-weight: 700;
          color: #474f5e;
          margin-bottom: 2px;
        }
        .sheet-headline {
          font-size: 18px;
          font-weight: 800;
          color: #111827;
          margin-bottom: 12px;
        }

        /* 6 Clay Faces Grid */
        .moods-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          margin-bottom: 12px;
        }
        .mood-option {
          background: #f7f9fc;
          border: 1.5px solid #eef1f6;
          border-radius: 18px;
          padding: 8px 4px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          cursor: pointer;
        }
        .mood-option.selected {
          background: #fff6da;
          border-color: #ffd875;
          box-shadow: 0 6px 14px rgba(255, 200, 50, 0.25);
        }
        .mood-face-img {
          width: 44px;
          height: 44px;
          object-fit: contain;
        }
        .mood-face-name {
          font-size: 11px;
          font-weight: 800;
          color: #2c3340;
        }

        .mood-note-box {
          background: #f8fafc;
          border: 1.5px solid #e2e8f0;
          border-radius: 14px;
          padding: 8px 12px;
          font-size: 11px;
          font-weight: 600;
          color: #1e293b;
          margin-bottom: 10px;
        }
        .mood-share-btn {
          width: 100%;
          background: #2563eb;
          color: #ffffff;
          border: none;
          border-radius: 16px;
          padding: 10px;
          font-size: 13px;
          font-weight: 800;
          box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
          cursor: pointer;
        }

        /* Cursor Simulator */
        .cursor-pointer {
          position: absolute;
          width: 28px;
          height: 28px;
          background: rgba(37, 99, 235, 0.85);
          border: 2.5px solid #ffffff;
          border-radius: 50%;
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
          pointer-events: none;
          z-index: 50;
          opacity: 0;
        }

        /* Floating Left Content */
        .floating-left {
          position: absolute;
          left: 120px;
          top: 360px;
          max-width: 480px;
          z-index: 5;
        }
        .section-tag {
          font-size: 16px;
          font-weight: 800;
          color: #9a3412;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          margin-bottom: 12px;
        }
        .section-title {
          font-size: 56px;
          font-weight: 900;
          color: #111827;
          line-height: 1.15;
          letter-spacing: -0.035em;
          margin-bottom: 20px;
        }
        .gradient-warm {
          background: linear-gradient(135deg, #ea580c 0%, #d97706 50%, #2563eb 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .section-body {
          font-size: 22px;
          color: #4b5563;
          line-height: 1.55;
        }

        /* Floating Right Badges & Mascot */
        .floating-right {
          position: absolute;
          right: 140px;
          top: 300px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
          z-index: 5;
        }
        .feature-badge {
          background: #ffffff;
          padding: 16px 26px;
          border-radius: 24px;
          box-shadow: 0 16px 40px rgba(32, 38, 51, 0.08);
          font-size: 18px;
          font-weight: 700;
          color: #1f2937;
          display: flex;
          align-items: center;
          gap: 12px;
          border: 1px solid #eef1f6;
        }
        .badge-icon {
          font-size: 24px;
        }
        .mascot-mood {
          width: 230px;
          height: auto;
          filter: drop-shadow(0 20px 40px rgba(32, 38, 51, 0.15));
        }
      </style>

      <div id="root" data-composition-id="scene6" data-width="1920" data-height="1080">
        <div class="ambient-mesh"></div>

        <div class="stage-container">
          <!-- Floating Left Content -->
          <div class="floating-left">
            <div class="section-tag" id="el-tag">Shared Plans &amp; Daily Moods</div>
            <h2 class="section-title" id="el-title">Coordinated Living <br><span class="gradient-warm">Rooted in Empathy</span></h2>
            <p class="section-body" id="el-body">
              Add dinner dates and deep cleans directly to your shared calendar, and share your daily mood so housemates know when you need quiet focus or when you're ready to celebrate.
            </p>
          </div>

          <!-- Centered Phone Mockup with Authentic Calendar & MoodSheet -->
          <div class="phone-wrapper" id="el-phone" data-layout-allow-overflow>
            <div class="phone-mockup" data-layout-allow-overflow>
              <div class="screen-inner" data-layout-allow-overflow>
                <!-- Authentic Flutter Shared Calendar Base Screen -->
                <img src="assets/screens/calendar.png" alt="Stewardie Shared Calendar" class="screen-bg" />

                <!-- Shared Plan Card Overlay -->
                <div class="plan-card-overlay" id="el-plan-card" data-layout-allow-overlap data-layout-allow-occlusion>
                  <div class="plan-top" data-layout-allow-overlap data-layout-allow-occlusion>
                    <span class="plan-tag" data-layout-allow-overlap data-layout-allow-occlusion>Crew Event</span>
                    <span style="font-size: 12px; font-weight: 700; color: #1e40af;" data-layout-allow-overlap data-layout-allow-occlusion>Saturday</span>
                  </div>
                  <div class="plan-name" data-layout-allow-overlap data-layout-allow-occlusion>Saturday Deep Clean &amp; Pizza 🍕</div>
                  <div class="plan-meta" data-layout-allow-overlap data-layout-allow-occlusion>🕒 6:00 PM • Apartment 4B Lounge</div>
                  <div class="plan-crew" data-layout-allow-overlap data-layout-allow-occlusion>
                    <div class="crew-avatar">J</div>
                    <div class="crew-avatar alex">A</div>
                    <div class="crew-avatar sam">S</div>
                    <span style="font-size: 11px; font-weight: 700; color: #474f5e; margin-left: 6px;" data-layout-allow-overlap data-layout-allow-occlusion>All 4 attending</span>
                  </div>
                </div>

                <!-- Authentic MoodSheet -->
                <div class="mood-sheet" id="el-mood-sheet" data-layout-allow-overflow data-layout-allow-overlap>
                  <div class="sheet-drag"></div>
                  <div class="sheet-caption">A moment for you</div>
                  <div class="sheet-headline">How are you feeling today?</div>

                  <div class="moods-grid">
                    <div class="mood-option selected" id="opt-happy">
                      <img src="assets/illustrations/mood-butter-happy.png" alt="Happy" class="mood-face-img" />
                      <span class="mood-face-name">Happy</span>
                    </div>
                    <div class="mood-option">
                      <img src="assets/illustrations/mood-butter-calm.png" alt="Calm" class="mood-face-img" />
                      <span class="mood-face-name">Calm</span>
                    </div>
                    <div class="mood-option">
                      <img src="assets/illustrations/mood-butter-tired.png" alt="Tired" class="mood-face-img" />
                      <span class="mood-face-name">Tired</span>
                    </div>
                    <div class="mood-option">
                      <img src="assets/illustrations/mood-butter-excited.png" alt="Excited" class="mood-face-img" />
                      <span class="mood-face-name">Excited</span>
                    </div>
                    <div class="mood-option">
                      <img src="assets/illustrations/mood-butter-overwhelmed.png" alt="Overwhelmed" class="mood-face-img" />
                      <span class="mood-face-name">Overwhelmed</span>
                    </div>
                    <div class="mood-option">
                      <img src="assets/illustrations/mood-butter-sad.png" alt="Sad" class="mood-face-img" />
                      <span class="mood-face-name">Sad</span>
                    </div>
                  </div>

                  <div class="mood-note-box" id="el-note-box">
                    Crushed my exam, ready to celebrate! 🎉
                  </div>

                  <button class="mood-share-btn" id="el-share-btn">Share Check-In</button>
                </div>

                <!-- Cursor -->
                <div class="cursor-pointer" id="el-cursor"></div>
              </div>
            </div>
          </div>

          <!-- Floating Right Badges & Mascot -->
          <div class="floating-right">
            <div class="feature-badge" id="el-badge1">
              <div class="badge-icon">📅</div>
              <span>Shared Household Calendar</span>
            </div>
            <div class="feature-badge" id="el-badge2">
              <div class="badge-icon">🌱</div>
              <span>Daily Emotional Pulse</span>
            </div>
            <img src="assets/illustrations/tour-mood-checkin.png" alt="Mood Check-in Mascot" class="mascot-mood" id="el-mascot" />
          </div>
        </div>

        <script>
          const tl = gsap.timeline({ paused: true });
          window.__timelines["scene6"] = tl;

          // Frame entrance (0s - 1.5s)
          tl.from("#el-phone", {
            scale: 0.9,
            y: 50,
            opacity: 0,
            duration: 1.2,
            ease: "power3.out"
          }, 0);

          tl.from("#el-tag, #el-title, #el-body", {
            x: -40,
            opacity: 0,
            stagger: 0.15,
            duration: 1.0,
            ease: "power2.out"
          }, 0.2);

          tl.from("#el-badge1, #el-badge2, #el-mascot", {
            x: 40,
            opacity: 0,
            stagger: 0.15,
            duration: 1.0,
            ease: "power2.out"
          }, 0.4);

          // Subtle mascot breathing
          tl.to("#el-mascot", {
            y: -12,
            duration: 2.2,
            repeat: 7,
            yoyo: true,
            ease: "sine.inOut"
          }, 1.2);

          // Calendar Plan card pops up at 1.8s
          tl.fromTo("#el-plan-card", {
            scale: 0.85,
            opacity: 0,
            y: 20
          }, {
            scale: 1,
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: "back.out(1.8)"
          }, 1.8);

          // Mood Sheet slides up at 5.5s (synced with narration shift to moods)
          tl.to("#el-plan-card", { opacity: 0, duration: 0.4 }, 5.5);
          tl.to("#el-mood-sheet", {
            y: "0%",
            duration: 1.0,
            ease: "power3.out"
          }, 5.5);

          // Cursor selects Happy Butter at 7.0s
          tl.fromTo("#el-cursor", {
            x: 240,
            y: 580,
            opacity: 0
          }, {
            x: 75,
            y: 285,
            opacity: 1,
            duration: 0.7,
            ease: "power2.out"
          }, 6.8);

          // Tap Happy
          tl.to("#opt-happy", {
            scale: 0.92,
            duration: 0.15,
            yoyo: true,
            repeat: 1
          }, 7.5);

          // Cursor moves to Share Check-In button at 8.0s
          tl.to("#el-cursor", {
            x: 160,
            y: 475,
            duration: 0.6,
            ease: "power2.inOut"
          }, 8.0);

          // Tap Share (synced with mood_checked_in.wav at 8.8s)
          tl.to("#el-share-btn", {
            scale: 0.95,
            duration: 0.15,
            yoyo: true,
            repeat: 1
          }, 8.7);
          tl.to("#el-cursor", { opacity: 0, duration: 0.3 }, 8.9);

          // Celebration glow on selected mood
          tl.to("#opt-happy", {
            boxShadow: "0 0 25px rgba(250, 204, 21, 0.8)",
            duration: 0.5,
            yoyo: true,
            repeat: 3
          }, 8.9);

          // Hold and exit transition at 17.0s
          tl.to("#root", {
            opacity: 0,
            duration: 1.0,
            ease: "power2.in"
          }, 17.0);

          tl.seek(0);
        </script>
      </div>
    </template>
  </body>
</html>
